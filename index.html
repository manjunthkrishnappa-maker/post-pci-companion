<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Heart Recovery Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>

  <style>
    /* PROFESSIONAL CLINICAL THEME */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Google Sans', Arial, sans-serif;
      background-color: #f0f2f5; /* Clean, medical grey-white */
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1f1f1f;
    }

    .welcome-container {
      text-align: center;
      max-width: 500px;
      padding: 40px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    h1 {
      font-size: 2rem;
      color: #1a73e8; /* Hospital Blue */
      margin-bottom: 15px;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.5;
      color: #5f6368;
    }

    /* DIALOGFLOW MESSENGER STYLING */
    df-messenger {
      z-index: 999;
      position: fixed;
      bottom: 24px;
      right: 24px;
      --df-messenger-font-family: 'Google Sans';
      --df-messenger-chat-background: #f8f9fa;
      --df-messenger-message-user-background: #d3e3fd;
      --df-messenger-message-bot-background: #ffffff;
      --df-messenger-chat-bubble-background: #1a73e8;
    }
  </style>
</head>

<body>

  <div class="welcome-container">
    <h1>🫀 Recovery Assistant</h1>
    <p>Welcome to your post-procedure companion.</p>
    <p>Please click the <strong>blue chat icon</strong> in the bottom right corner to begin your daily check-in.</p>
  </div>

  <df-messenger
    location="us-central1"
    project-id="post-pci-companion"
    agent-id="17fa7a25-1eaf-4592-a58c-92edb37ee06b"
    language-code="en"
    max-query-length="-1">
    <df-messenger-chat-bubble
      chat-title="POST-PCI COMPANION">
    </df-messenger-chat-bubble>
  </df-messenger>

</body>
</html>
