<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HeartCare | Elite Post-PCI Recovery Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>

  <style>
    :root {
      --primary-blue: #0061ff;
      --deep-navy: #0a0e17;
      --medical-cyan: #00f2fe;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Google Sans', 'Inter', sans-serif;
      background: var(--deep-navy);
      color: #ffffff;
      overflow-x: hidden;
    }

    /* THE IMMERSIVE VIDEO LAYER */
    .video-container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: -2;
      background: #000;
    }

    /* Muted & Playsinline are critical for Physician Portals on Mobile */
    video {
      width: 100%; height: 100%;
      object-fit: cover;
      filter: brightness(0.4) saturate(0.8);
    }

    .shader {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0,0,0,0) 0%, rgba(10,14,23,0.8) 100%),
                  linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(10,14,23,0.9) 100%);
      z-index: -1;
    }

    section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 10%;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 32px;
      padding: 50px;
      max-width: 800px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: clamp(2rem, 5vw, 4rem);
      margin-bottom: 20px;
      background: linear-gradient(90deg, #fff, #8ab4f8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 30px;
    }

    /* DIALOGFLOW MESSENGER SETTINGS */
    df-messenger {
      z-index: 999;
      position: fixed;
      bottom: 30px; right: 30px;
      --df-messenger-chat-bubble-background: #0061ff;
    }
  </style>
</head>
<body>

  <div class="video-container">
    <video autoplay muted loop playsinline poster="fallback-image.jpg">
      <source src="background.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <div class="shader"></div>

  <section>
    <div class="glass-card">
      <h1>Precision Recovery.</h1>
      <p>
        AI-driven clinical monitoring for post-procedure cardiac care. 
        Your progress is reviewed by our medical team in real-time.
      </p>
      <div style="color: var(--medical-cyan); font-weight: 500;">
        Start your daily check-in via the assistant →
      </div>
    </div>
  </section>

  <df-messenger
    location="us-central1"
    project-id="post-pci-companion"
    agent-id="17fa7a25-1eaf-4592-a58c-92edb37ee06b"
    language-code="en"
    max-query-length="-1">
    <df-messenger-chat-bubble chat-title="Heart Assistant"></df-messenger-chat-bubble>
  </df-messenger>

</body>
</html>
